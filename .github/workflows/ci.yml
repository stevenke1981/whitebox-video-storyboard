name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build & test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux GUI / build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libxkbcommon-dev libgl1-mesa-dev libwayland-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Build (release)
        run: cargo build --release --locked

      - name: Test
        run: cargo test --release --locked

      - name: Clippy
        run: cargo clippy --release --all-targets --locked

      - name: Headless export smoke test
        shell: bash
        run: |
          B=target/release/whitebox-video-storyboard
          $B --version
          ls -l $B*
          # default: creates out/sample_project_<YYYYMMDD_HHMMSS>/ with every format
          D=$($B --export examples/sample_project.json out | head -n1)
          echo "exported to $D"
          ls -la "$D"
          for f in scene_01_scene_1.png storyboard_overview.png layout.json project.json AGENT_GUIDE.md render_moviepy.py storyboard.html storyboard.md fonts/NotoSansCJKtc-Subset.otf; do
            test -s "$D/$f" || { echo "missing $f"; exit 1; }
          done
          grep -q 'data:image/png;base64,' "$D/storyboard.html"
          grep -q '版面文字說明' "$D/storyboard.md"
          # format subsets / flat output
          $B --export examples/sample_project_9x16.json out/sample_9x16 --no-subdir --safe-guides --formats png,html,md
          test -s out/sample_9x16/storyboard.html && test -s out/sample_9x16/storyboard.md
          test ! -e out/sample_9x16/layout.json
          $B --export examples/sample_project.json out/md_only --no-subdir --formats md
          test "$(ls out/md_only)" = "storyboard.md"
          # scene templates + English output
          $B --templates
          $B --templates --lang en | grep -q 'Credits roll'
          $B --from-templates all out/templates_zh.json
          $B --from-templates all out/templates_en.json --preset 9:16 --lang en --name "Template demo"
          $B --add-template examples/sample_project.json quiz,outro --at 1 -o out/sample_plus.json
          $B --export out/templates_zh.json out/tpl_zh --no-subdir
          $B --export out/templates_en.json out/tpl_en --no-subdir --lang en
          grep -q '版面文字說明' out/tpl_zh/storyboard.md
          grep -q '# Layout description' out/tpl_en/storyboard.md
          grep -q '"transition"' out/tpl_en/layout.json
          grep -q '"language": "en"' out/tpl_en/layout.json
          grep -q 'Scene transitions' out/tpl_en/AGENT_GUIDE.md
          test "$(ls out/tpl_en/scene_*.png | wc -l)" -eq 14
          WVS_LANG=en $B --help | grep -q 'USAGE'

      - name: Upload exported drafts
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: exported-drafts
          path: out/

  moviepy:
    name: MoviePy render test
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install MoviePy
        run: pip install -r examples/requirements.txt
      - name: Render sample layout (preview)
        run: |
          python examples/render_moviepy.py examples/layout.json -o preview.mp4 --preview --frames-dir frames --transition-frames
          ls -la preview.mp4 frames
      - uses: actions/download-artifact@v8
        with:
          name: exported-drafts
          path: drafts
      - name: Render 14-template project (English, 9:16) incl. every transition type
        run: |
          python examples/render_moviepy.py drafts/tpl_en/layout.json --preview --frames-dir frames_tpl --transition-frames --no-video
          test "$(ls frames_tpl/*_transition_*.png | wc -l)" -ge 10
      - uses: actions/upload-artifact@v7
        with:
          name: moviepy-preview
          path: |
            preview.mp4
            frames/
            frames_tpl/
