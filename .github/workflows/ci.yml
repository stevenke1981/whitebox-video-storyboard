name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build & test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux GUI / build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libxkbcommon-dev libgl1-mesa-dev libwayland-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Build (release)
        run: cargo build --release --locked

      - name: Test
        run: cargo test --release --locked

      - name: Clippy
        run: cargo clippy --release --all-targets --locked

      - name: Headless export smoke test
        shell: bash
        run: |
          B=target/release/whitebox-video-storyboard
          $B --version
          $B --export examples/sample_project.json out/sample
          $B --export examples/sample_project_9x16.json out/sample_9x16 --safe-guides
          ls -la out/sample

      - name: Upload exported drafts
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: exported-drafts
          path: out/

  moviepy:
    name: MoviePy render test
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install MoviePy
        run: pip install -r examples/requirements.txt
      - name: Render sample layout (preview)
        run: |
          python examples/render_moviepy.py examples/layout.json -o preview.mp4 --preview --frames-dir frames
          ls -la preview.mp4 frames
      - uses: actions/upload-artifact@v4
        with:
          name: moviepy-preview
          path: |
            preview.mp4
            frames/
