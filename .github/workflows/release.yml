name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  BIN: whitebox-video-storyboard

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
          - name: macos-x86_64
            os: macos-latest
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libxkbcommon-dev libgl1-mesa-dev libwayland-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          [ "$GITHUB_REF_TYPE" = "tag" ] || VERSION=$(grep -m1 '^version' Cargo.toml | cut -d '"' -f2)
          PKG="$BIN-$VERSION-${{ matrix.name }}"
          mkdir -p "dist/$PKG"
          EXT=""; [ "${{ runner.os }}" = "Windows" ] && EXT=".exe"
          cp "target/${{ matrix.target }}/release/$BIN$EXT" "dist/$PKG/"
          cp README.md LICENSE "dist/$PKG/"
          cp -r examples "dist/$PKG/examples"
          mkdir -p "dist/$PKG/fonts" && cp assets/fonts/* "dist/$PKG/fonts/"
          cd dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "$PKG.zip" "$PKG" > /dev/null
          else
            tar czf "$PKG.tar.gz" "$PKG"
          fi
          ls -la

      - uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.name }}
          path: |
            dist/*.zip
            dist/*.tar.gz
          if-no-files-found: error

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/*.tar.gz
          generate_release_notes: true
