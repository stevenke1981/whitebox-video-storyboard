name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  BIN: whitebox-video-storyboard

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
          - name: macos-x86_64
            os: macos-latest
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libxkbcommon-dev libgl1-mesa-dev libwayland-dev p7zip-full

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package (AES-256 encrypted zip)
        shell: bash
        env:
          RELEASE_ZIP_PASSWORD: ${{ secrets.RELEASE_ZIP_PASSWORD }}
        run: |
          if [ -z "$RELEASE_ZIP_PASSWORD" ]; then
            echo "::error::repository secret RELEASE_ZIP_PASSWORD is not set"
            exit 1
          fi
          VERSION=${GITHUB_REF_NAME#v}
          [ "$GITHUB_REF_TYPE" = "tag" ] || VERSION=$(grep -m1 '^version' Cargo.toml | cut -d '"' -f2)
          PKG="$BIN-$VERSION-${{ matrix.name }}"
          mkdir -p "dist/$PKG"
          EXT=""; [ "${{ runner.os }}" = "Windows" ] && EXT=".exe"
          cp "target/${{ matrix.target }}/release/$BIN$EXT" "dist/$PKG/"
          cp README.md README.en.md CHANGELOG.md LICENSE "dist/$PKG/"
          cp -r examples "dist/$PKG/examples"
          rm -rf "dist/$PKG/examples/__pycache__"
          mkdir -p "dist/$PKG/fonts" && cp assets/fonts/NotoSansCJKtc-Subset.otf assets/fonts/LICENSE-OFL.txt "dist/$PKG/fonts/"
          # 7-Zip: preinstalled on Windows, p7zip on Linux, Homebrew sevenzip (7zz) on macOS
          if command -v 7z >/dev/null; then SZ=7z
          elif command -v 7zz >/dev/null; then SZ=7zz
          else brew install sevenzip >/dev/null && SZ=7zz; fi
          cd dist
          "$SZ" a -tzip -mem=AES256 -mx=9 -bso0 -bsp0 -p"$RELEASE_ZIP_PASSWORD" "$PKG.zip" "$PKG"
          # sanity check: listing works, extraction without the password must fail
          "$SZ" l -slt "$PKG.zip" > ../zip-list.txt
          grep -m1 -i 'AES-256' ../zip-list.txt
          if "$SZ" t -p"wrong-password" "$PKG.zip" >/dev/null 2>&1; then
            echo "::error::archive is not password protected"; exit 1
          fi
          "$SZ" t -p"$RELEASE_ZIP_PASSWORD" "$PKG.zip" -bso0
          ls -la

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: dist/*.zip
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Checksums and release notes
        shell: bash
        run: |
          cd dist
          sha256sum *.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt
          cd ..
          VERSION=${GITHUB_REF_NAME#v}
          {
            echo "## Whitebox Video Storyboard $GITHUB_REF_NAME"
            echo
            echo "🔒 **下載檔為加密壓縮檔（AES-256 ZIP）**：請使用 7-Zip / Keka / \`7z x\` 解壓，密碼請向作者索取。"
            echo
            echo "🔒 **The downloads are password-protected AES-256 ZIP archives.** Extract them with 7-Zip, Keka or \`7z x <file>.zip\` (the built-in Windows / macOS unzip may not support AES). Please ask the author for the password."
            echo
            echo "| Platform | File |"
            echo "|---|---|"
            for f in dist/*.zip; do n=$(basename "$f"); p=${n#whitebox-video-storyboard-$VERSION-}; echo "| ${p%.zip} | \`$n\` |"; done
            echo
            echo "SHA-256 checksums: \`SHA256SUMS.txt\`."
            echo
            # the matching CHANGELOG section
            awk -v v="$VERSION" '
              /^## / { if (p) exit; if (index($0, "## " v " ") == 1) { p = 1; print "### Changes"; next } }
              p { print }
            ' CHANGELOG.md
          } > notes.md
          cat notes.md

      - name: Create release (once, with all assets)
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          body_path: notes.md
          generate_release_notes: true
          files: |
            dist/*.zip
            dist/SHA256SUMS.txt
          fail_on_unmatched_files: true
